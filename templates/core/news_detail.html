{% extends 'core/base.html' %}
{% block title %}{{ news.title }}{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header bg-primary text-white">
        <h3>{{ news.title }}</h3>
    </div>
    <div class="card-body">
        {% if news.image %}
            <img src="{{ news.image.url }}" class="img-fluid mb-4" alt="{{ news.title }}">
        {% endif %}
        <p class="text-muted">Дата публикации: {{ news.created_at|date:"d/m/Y H:i" }}</p>
        <hr>
        <p>{{ news.content|linebreaks }}</p>
    </div>
    <div class="card-footer">
        <a href="{% url 'news_list' %}" class="btn btn-secondary">← Назад к новостям</a>
    </div>
</div>
{% endblock %}
